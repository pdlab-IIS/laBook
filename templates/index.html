<!DOCTYPE html>
<html>

<head>
    <title>laBook[alpha-version]</title>
    <script>window.initialShelfFilter = {{ (initial_filter or "")|tojson }};</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='index.js') }}"></script>
    <script src="{{ url_for('static', filename='general.js') }}"></script>
    <script src="https://kit.fontawesome.com/6be837db5c.js" crossorigin="anonymous"></script>
    <link rel="icon" href="{{ url_for('static', filename='bdb-favicon.svg') }}" type="image/svg+xml" />
    <!-- Font Awesome Free by @fontawesome 
       Licensed under CC BY 4.0: https://creativecommons.org/licenses/by/4.0/ 
       https://fontawesome.com/license/free -->
    <meta property="og:title"        content="laBook">
    <meta property="og:description"  content="laBook is a book management system for libraries and personal collections.">
    <meta property="og:type"         content="website">
    <meta property="og:url"          content="https://pdlab.iis.u-tokyo.ac.jp/labook">
    <meta property="og:image"        content="https://pdlab.iis.u-tokyo.ac.jp/labook/static/ogp.jpg">
    <meta property="og:image:secure_url" content="https://pdlab.iis.u-tokyo.ac.jp/labook/static/ogp.jpg">
    <meta property="og:image:type"   content="image/jpeg">
    <meta property="og:image:width"  content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt"    content="ogp of laBook">
</head>

<body>
    {% include "_development_overlay.html" %}
    <a href="./">
        <h2><i class="fa-solid fa-database"></i>laBook</h2>
    </a>
    <input type="text" id="searchInput" style="min-width:400px" placeholder="ISBN / Title / Author / Publisher">
    <button type="button" id="searchBtn"><i class="fas fa-search" aria-hidden="true"></i></button>
    <button type="button" id="resetBtn" class="grey" style="margin-left: 0px;"><i class="fas fa-undo" aria-hidden="true"></i></button>
    <span id="spnLockMode" title="[secret command] Continuous registration mode for inventory">&emsp;</span>
    <button type="button" id="btnScanner"><i class="fa-solid fa-barcode"></i> scanner</button>
    <button type="button" id="addBookBtn" class="grey"><i class="fas fa-book-medical" aria-hidden="true"></i> add book</button>
    <span id="spnSpd"></span>
    <table id="booksTable" class="book-list-table">
        <thead>
            <tr>
                <th>Cover</th>
                <th data-key="title">
                    Title
                    <span class="indicator"></span>
                </th>
                <th data-key="author">
                    Author
                    <span class="indicator"></span>
                </th>
                <th data-key="publisher">
                    Publisher
                    <span class="indicator"></span>
                </th>
                <th data-key="publication_date">
                    Publish
                    <span class="indicator"></span>
                </th>
                <th>Location</th>
                <th data-key="status">
                    Status
                    <span class="indicator"></span>
                </th>
            </tr>
        </thead>
        <tbody>
            <!-- Filled by index.js -->
        </tbody>
    </table>
    <div id="pagination" style="margin: 20px 0; text-align: center;">
    <button id="prevPageBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
    <span id="pageInfo"></span>
    <button id="nextPageBtn">Next <i class="fa-solid fa-angles-right"></i></button>
    </div>
</body>

</html>
