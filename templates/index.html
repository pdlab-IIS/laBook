<!DOCTYPE html>
<html>

<head>
    <title>laBook[alpha-version]</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>window.initialShelfFilter = {{ (initial_filter or "")|tojson }};</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='index.js') }}"></script>
    <script src="{{ url_for('static', filename='general.js') }}"></script>
    <script src="https://kit.fontawesome.com/6be837db5c.js" crossorigin="anonymous"></script>
    <link rel="icon" href="{{ url_for('static', filename='bdb-favicon.svg') }}" type="image/svg+xml" />
    <!-- Font Awesome Free by @fontawesome 
       Licensed under CC BY 4.0: https://creativecommons.org/licenses/by/4.0/ 
       https://fontawesome.com/license/free -->
    <meta property="og:title"        content="laBook">
    <meta property="og:description"  content="laBook is a book management system for libraries and personal collections.">
    <meta property="og:type"         content="website">
    <meta property="og:url"          content="https://pdlab.iis.u-tokyo.ac.jp/labook">
    <meta property="og:image"        content="https://pdlab.iis.u-tokyo.ac.jp/labook/static/ogp.jpg">
    <meta property="og:image:secure_url" content="https://pdlab.iis.u-tokyo.ac.jp/labook/static/ogp.jpg">
    <meta property="og:image:type"   content="image/jpeg">
    <meta property="og:image:width"  content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt"    content="ogp of laBook">
</head>

<body>
    {% include "_development_overlay.html" %}
    <header class="app-header">
        <a class="app-brand" href="./">
            <h1><i class="fa-solid fa-database" aria-hidden="true"></i>laBook</h1>
        </a>
        <div class="app-header-actions">
            <button type="button" id="btnScanner" class="app-header-action" aria-label="スキャナー">
                <i class="fa-solid fa-barcode" aria-hidden="true"></i>
                <span class="app-header-action__label">scanner</span>
            </button>
            <button type="button" id="addBookBtn" class="app-header-action grey" aria-label="本を追加">
                <i class="fas fa-book-medical" aria-hidden="true"></i>
                <span class="app-header-action__label">add book</span>
            </button>
            <div id="utilityMenu" class="utility-menu">
                <button type="button" id="utilityMenuToggle" class="utility-menu__toggle"
                        aria-label="メニュー" aria-expanded="false" aria-controls="utilityMenuPanel">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <div id="utilityMenuPanel" class="utility-menu__panel" hidden>
                    <button type="button" id="resetBtn" class="utility-menu__item grey">
                        <i class="fas fa-undo" aria-hidden="true"></i>
                        <span>リロード</span>
                    </button>
                    <button type="button" id="spnLockMode" class="utility-menu__item grey"
                            title="棚卸し用の連続登録モード">
                        <i class="fa-solid fa-clipboard-check" aria-hidden="true"></i>
                        <span>棚卸しモード</span>
                        <span id="lockModeStatus" class="utility-menu__status" aria-live="polite">オフ</span>
                    </button>
                    <div class="utility-menu__item utility-menu__access">
                        <i class="fa-solid fa-network-wired" aria-hidden="true"></i>
                        <span>アクセスモード</span>
                        <span id="spnSpd" class="utility-menu__status" aria-live="polite"></span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <div class="search-controls">
        <input type="text" id="searchInput" placeholder="ISBN / Title / Author / Publisher">
        <button type="button" id="searchBtn" aria-label="検索"><i class="fas fa-search" aria-hidden="true"></i></button>
    </div>
    <table id="booksTable" class="book-list-table">
        <thead>
            <tr>
                <th>Cover</th>
                <th data-key="title">
                    Title
                    <span class="indicator"></span>
                </th>
                <th data-key="author">
                    Author
                    <span class="indicator"></span>
                </th>
                <th data-key="publisher">
                    Publisher
                    <span class="indicator"></span>
                </th>
                <th data-key="publication_date">
                    Publish
                    <span class="indicator"></span>
                </th>
                <th>Location</th>
                <th data-key="status">
                    Status
                    <span class="indicator"></span>
                </th>
            </tr>
        </thead>
        <tbody>
            <!-- Filled by index.js -->
        </tbody>
    </table>
    <div id="pagination" style="margin: 20px 0; text-align: center;">
    <button id="prevPageBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
    <span id="pageInfo"></span>
    <button id="nextPageBtn">Next <i class="fa-solid fa-angles-right"></i></button>
    </div>
</body>

</html>
