# Version-controlled baseline of the active production configuration.
#
# The permissive CORS policy is intentionally preserved until the consumers and
# authentication boundary are confirmed. Do not expand it further. In
# particular, wildcard origins combined with credentials are a known issue
# tracked in docs/debugging-plan.md Phase 5.
server {
    listen 80 default_server;
    server_name _;

    add_header 'Access-Control-Allow-Origin'      '*' always;
    add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, ngrok-skip-browser-warning' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
