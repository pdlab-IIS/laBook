# Legacy local proxy for reaching the public ngrok endpoint on port 8080.
#
# Keep the upstream in a variable so nginx resolves it at request time. A
# literal hostname in proxy_pass is resolved while nginx loads its config; if
# Wi-Fi/DNS is not ready during boot, that would prevent every nginx server,
# including the independent laBook listener on port 80, from starting.
resolver 8.8.8.8 8.8.4.4 valid=30s ipv6=off;

server {
    listen 8080;
    server_name localhost;

    set $ngrok_upstream lenient-bug-absolute.ngrok-free.app;

    location / {
        proxy_ssl_server_name on;
        proxy_ssl_name $ngrok_upstream;

        proxy_set_header ngrok-skip-browser-warning 1;
        proxy_set_header Host $ngrok_upstream;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass https://$ngrok_upstream;
    }
}
